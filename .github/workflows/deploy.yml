name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # Create config.js with EmailJS and Google Calendar credentials
      - name: Create config file
        run: |
          echo "const config = {
            emailjs: {
              publicKey: '${{ secrets.EMAILJS_PUBLIC_KEY }}',
              serviceId: '${{ secrets.EMAILJS_SERVICE_ID }}',
              templateId: '${{ secrets.EMAILJS_TEMPLATE_ID }}'
            },
            googleCalendar: {
              apiKey: '${{ secrets.GOOGLE_CALENDAR_API_KEY }}',
              calendarId: '${{ secrets.GOOGLE_CALENDAR_ID }}'
            }
          };
          export default config;" > js/config.js

      # Commit the changes
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f js/config.js
          git commit -m "Update config with EmailJS and Google Calendar settings"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
